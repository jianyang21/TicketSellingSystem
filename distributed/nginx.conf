worker_processes auto;

events {
    worker_connections 4096;
}

http {
    upstream sellers {
        least_conn;
        server app1:8000;
        server app2:8000;
        server app3:8000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://sellers;
            proxy_read_timeout 15s;
            proxy_connect_timeout 5s;
        }
    }
}
